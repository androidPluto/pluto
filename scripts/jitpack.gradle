tasks.register('publishToJitpack') {
    group = 'publishing'
    description = 'Builds all AAR modules and makes them ready for JitPack'

    // Detect all Android library modules
    def libraryModules = rootProject.subprojects.findAll {
        it.plugins.hasPlugin('com.android.library')
    }

    if (libraryModules.isEmpty()) {
        throw new GradleException("No library modules found to deploy.")
    }

    // Collect full module paths
    def modulePaths = libraryModules.collect { it.path }
    println "Detected library modules: $modulePaths"

    // Ensure we depend on assembling all AARs BEFORE execution
    dependsOn modulePaths.collect { "${it}:assembleRelease" }

    doLast {
        def aarDir = new File(buildDir, 'jitpack')
        if (!aarDir.exists()) {
            aarDir.mkdirs()
        }

        libraryModules.each { subproject ->
            def aarFile = new File("${subproject.buildDir}/outputs/aar/${subproject.name}-release.aar")
            if (aarFile.exists()) {
                def destination = new File(aarDir, "${subproject.path.replace(':', '_')}-release.aar")

                // Native Groovy file copy
                destination.withOutputStream { out ->
                    aarFile.withInputStream { inStream ->
                        out << inStream
                    }
                }

                println("Copied ${subproject.path}-release.aar to $aarDir")
            } else {
                println("Warning: AAR not found for ${subproject.path}")
            }
        }
    }
}
