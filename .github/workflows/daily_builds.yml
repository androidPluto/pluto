name: Daily Builds

on:
  schedule:
    - cron: '0 20 * * *'  # Runs daily at 20:00 UTC
  workflow_dispatch:  # Enables manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: ./gradlew --no-daemon --max-workers 8 --build-cache build
